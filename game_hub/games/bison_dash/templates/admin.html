<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bison Dash Admin</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #222; color: #fff; }
        .panel { border: 1px solid #555; padding: 15px; margin-bottom: 15px; background: #333; border-radius: 8px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .bison-card { border: 1px solid #777; padding: 10px; margin-top: 10px; background: #2a2a2a; border-radius: 5px; }
        button { padding: 10px 15px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-green { background: #4CAF50; color: white; }
        .btn-red { background: #F44336; color: white; }
        .btn-blue { background: #2196F3; color: white; margin-bottom: 10px;}
        input[type="number"] { width: 60px; }
        .timer-row { margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Bison Dash Admin Control</h1>

    <div class="grid">
        <div class="panel">
            <h2>Current State: <span id="current-state" style="color: #4CAF50;">Unknown</span></h2>
            <p>Elapsed Time: <span id="elapsed-time">0</span>s</p>
            <hr>
            <button class="btn-green" onclick="forceState('Betting_Open')">Force Betting_Open</button>
            <button class="btn-green" onclick="forceState('Soft_Closure')">Force Soft_Closure</button>
            <button class="btn-green" onclick="forceState('Closed_Intros')">Force Closed_Intros</button>
            <button class="btn-green" onclick="forceState('Race_Sprint')">Force Race_Sprint</button>
            <button class="btn-green" onclick="forceState('Results_Payout')">Force Results_Payout</button>

            <hr>
            <h3>Game Controls</h3>
            <button class="btn-red" onclick="panicReset()">Panic Reset Game</button>
            <br><br>
            <button class="btn-blue" onclick="window.location.href='/bison'">Go to Bison Builder</button>
        </div>

        <div class="panel">
            <h2>Elastic Clock Timers (Seconds)</h2>
            <div class="timer-row">Soft Closure: <input type="number" id="t-soft" value="10"></div>
            <div class="timer-row">Closed Intros: <input type="number" id="t-intros" value="60"></div>
            <div class="timer-row">Race Sprint: <input type="number" id="t-sprint" value="30"></div>
            <div class="timer-row">Results Payout: <input type="number" id="t-payout" value="120"></div>
            <button class="btn-blue" onclick="saveTimers()">Save Timers</button>
        </div>
    </div>

    <div class="panel">
        <h2>Current Lineup (6 Slots)</h2>
        <div id="lineup-container">Loading...</div>
    </div>

    <script>
        let availableBisons = [];

        async function fetchBisons() {
            try {
                const res = await fetch('/api/bisondash/bisons');
                const data = await res.json();
                if(data.status === 'success') availableBisons = data.bisons;
            } catch(e) {}
        }

        async function updateAdmin() {
            try {
                // Fetch state
                let res = await fetch('/api/current_race');
                let data = await res.json();
                document.getElementById('current-state').innerText = data.state;
                document.getElementById('elapsed-time').innerText = Math.floor(data.elapsed_time);

                // Fetch lineup
                let lineupHtml = '';
                data.lineup.forEach(b => {
                    let selectOptions = `<option value="">-- Empty / Procedural --</option>`;
                    availableBisons.forEach(ab => {
                        let sel = (ab.id === b.id) ? 'selected' : '';
                        selectOptions += `<option value="${ab.id}" ${sel}>${ab.name}</option>`;
                    });

                    lineupHtml += `
                        <div class="bison-card" style="border-left: 5px solid ${b.color}">
                            <strong>Slot ${b.slot}: ${b.name}</strong> (Speed: ${b.stats.bison_speed})<br>
                            Assign: <select id="assign-${b.slot}" onchange="assignBison(${b.slot}, this.value)">
                                ${selectOptions}
                            </select>
                        </div>
                    `;
                });
                document.getElementById('lineup-container').innerHTML = lineupHtml;
            } catch (e) {
                console.error("Admin fetch error", e);
            }
        }

        async function assignBison(slot, bisonId) {
            // Because we don't have a direct endpoint for slot assignment yet, we need to read/write lineup.json manually via a new endpoint.
            // Let's add that logic.
            try {
                await fetch('/api/bisondash/lineup/assign', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({slot: slot, bison_id: bisonId || null})
                });
                updateAdmin();
            } catch(e) {}
        }

        async function forceState(state) {
            await fetch('/api/bisondash/state/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({state: state})
            });
            updateAdmin();
        }

        async function panicReset() {
            await fetch('/api/local/reset', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: 'reset', timestamp: Date.now(), target_state: 'Betting_Open'})
            });
            updateAdmin();
        }

        async function saveTimers() {
            const payload = {
                soft_closure: parseInt(document.getElementById('t-soft').value),
                closed_intros: parseInt(document.getElementById('t-intros').value),
                race_sprint: parseInt(document.getElementById('t-sprint').value),
                results_payout: parseInt(document.getElementById('t-payout').value)
            };
            await fetch('/api/bisondash/timers/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            alert("Timers saved!");
        }

        async function init() {
            await fetchBisons();
            updateAdmin();
            setInterval(updateAdmin, 1000);
        }

        window.onload = init;
    </script>
</body>
</html>
