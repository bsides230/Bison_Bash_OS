<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bison Dash Projector</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        canvas {
            display: block;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #111;
            background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        #overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 6rem;
            text-align: center;
            font-weight: bold;
            text-shadow: 2px 2px 10px #000;
            pointer-events: none;
            z-index: 10;
        }

        #leaderboard {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 350px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #555;
            border-radius: 10px;
            color: white;
            padding: 15px;
            display: none;
            z-index: 20;
        }

        .leaderboard-title {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 2px solid #555;
            padding-bottom: 10px;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
            border-left: 10px solid;
        }

        #winner-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: white;
        }

        #winner-title {
            font-size: 8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #fff;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); text-shadow: 0 0 20px #fff; }
            to { transform: scale(1.05); text-shadow: 0 0 40px #ffea00; color: #ffea00; }
        }

        #winner-image-container {
            width: 500px;
            height: 500px;
            border: 15px solid #fff;
            border-radius: 20px;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            box-shadow: 0 0 50px rgba(255,255,255,0.5);
            overflow: hidden;
            position: relative;
        }

        #winner-sprite {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        #winner-fallback {
            font-size: 4rem;
            font-weight: bold;
            color: #555;
            text-align: center;
        }

        #winner-slot-indicator {
            font-size: 6rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="1920" height="1080"></canvas>

    <div id="overlay">WAITING FOR NEXT RACE...</div>

    <div id="leaderboard">
        <div class="leaderboard-title">LEADERBOARD</div>
        <div id="leaderboard-items"></div>
    </div>

    <div id="winner-screen">
        <div id="winner-title">WINNER!</div>
        <div id="winner-image-container">
            <img id="winner-sprite" src="" alt="Winner">
            <div id="winner-fallback">
                SLOT <br><span id="winner-slot-indicator"></span>
            </div>
        </div>
        <div id="winner-name" style="font-size: 5rem; font-weight: bold;"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const leaderboard = document.getElementById('leaderboard');
        const leaderboardItems = document.getElementById('leaderboard-items');

        const winnerScreen = document.getElementById('winner-screen');
        const winnerNameDisplay = document.getElementById('winner-name');
        const winnerImageContainer = document.getElementById('winner-image-container');
        const winnerSprite = document.getElementById('winner-sprite');
        const winnerFallbackText = document.getElementById('winner-fallback');
        const winnerSlot = document.getElementById('winner-slot-indicator');

        // Oval Track Boundaries (Counter-Clockwise)
        const waypoints = [
            {x: 960, y: 900},   // Start/Bottom Straight
            {x: 1520, y: 900},  // Turn 1 Start
            {x: 1720, y: 700},  // Turn 1 Apex
            {x: 1720, y: 500},  // Turn 2 Apex
            {x: 1520, y: 300},  // Back Straight Start
            {x: 400, y: 300},   // Turn 3 Start
            {x: 200, y: 500},   // Turn 3 Apex
            {x: 200, y: 700},   // Turn 4 Apex
            {x: 400, y: 900},   // Home Straight Start
            {x: 960, y: 900}    // Finish
        ];

        let state = "Betting_Open";
        let elapsed = 0;
        let lineup = [];
        let telemetry = {};
        let raceDuration = 90.0;

        function getNormal(p1, p2) {
            let dx = p2.x - p1.x;
            let dy = p2.y - p1.y;
            let dist = Math.hypot(dx, dy);
            if (dist === 0) return {nx: 0, ny: 0};
            return {nx: dy/dist, ny: -dx/dist};
        }

        function getLanePath(laneIndex) {
            // Offset logic identically matching simulator.py
            const offset = (laneIndex - 3.5) * 40;
            const lanePath = [];

            for(let i=0; i<waypoints.length; i++) {
                let p_prev = i > 0 ? waypoints[i-1] : waypoints[waypoints.length-2];
                let p_curr = waypoints[i];
                let p_next = i < waypoints.length - 1 ? waypoints[i+1] : waypoints[1];

                let n1 = getNormal(p_prev, p_curr);
                let n2 = getNormal(p_curr, p_next);

                let nx = n1.nx + n2.nx;
                let ny = n1.ny + n2.ny;

                let n_dist = Math.hypot(nx, ny);
                if (n_dist !== 0) {
                    nx /= n_dist;
                    ny /= n_dist;
                } else {
                    nx = n1.nx;
                    ny = n1.ny;
                }

                lanePath.push({
                    x: p_curr.x + nx * offset,
                    y: p_curr.y + ny * offset
                });
            }
            if (waypoints[0].x === waypoints[waypoints.length-1].x && waypoints[0].y === waypoints[waypoints.length-1].y) {
                lanePath[lanePath.length-1] = {x: lanePath[0].x, y: lanePath[0].y};
            }
            return lanePath;
        }

        function drawTrack() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw field
            ctx.beginPath();
            ctx.moveTo(waypoints[0].x, waypoints[0].y);
            for(let i=1; i<waypoints.length; i++) {
                ctx.lineTo(waypoints[i].x, waypoints[i].y);
            }
            ctx.fillStyle = '#2d5a27'; // Dark grass green
            ctx.fill();

            // Draw main track background
            ctx.beginPath();
            ctx.moveTo(waypoints[0].x, waypoints[0].y);
            for(let i=1; i<waypoints.length; i++) {
                ctx.lineTo(waypoints[i].x, waypoints[i].y);
            }
            ctx.strokeStyle = '#6a4d3a';
            ctx.lineWidth = 320; // Expanded for 6 full 40px lanes + padding
            ctx.lineJoin = 'round';
            ctx.stroke();

            // Draw 6 parallel lane lines
            for (let lane = 1; lane <= 6; lane++) {
                const lanePath = getLanePath(lane);
                ctx.beginPath();
                ctx.moveTo(lanePath[0].x, lanePath[0].y);
                for(let i=1; i<lanePath.length; i++) {
                    ctx.lineTo(lanePath[i].x, lanePath[i].y);
                }
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 2;
                ctx.setLineDash([15, 15]);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            // Draw Start/Finish line covering all lanes
            ctx.strokeStyle = '#ff0';
            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.moveTo(960, 725);
            ctx.lineTo(960, 1075);
            ctx.stroke();
        }

        const spriteImages = {};

        function loadSprite(bison_id) {
            if (!spriteImages[bison_id]) {
                const img = new Image();
                img.src = `/static/bisons/${bison_id}.png`;
                spriteImages[bison_id] = img;
            }
        }

        function drawBison(x, y, color, id, slotIndex) {
            if (id) loadSprite(id);
            const img = spriteImages[id];

            // Fixed top-down bounding box dimensions fitting within 40px lane
            const size = 32;

            if(img && img.complete && img.naturalHeight !== 0) {
                // Render single static clean image directly
                ctx.drawImage(img, x - size/2, y - size/2, size, size);
            } else {
                // Fallback colored rectangle only if image is missing
                ctx.fillStyle = color;
                ctx.fillRect(x - size/2, y - size/2, size, size);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(x - size/2, y - size/2, size, size);

                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(slotIndex, x, y);
            }
        }

        function getInterpolatedPosition(bisonId, t) {
            const data = telemetry[bisonId];
            if(!data || data.length === 0) return null;

            if(t >= raceDuration) {
                const last = data[data.length - 1];
                return {x: last.x, y: last.y};
            }
            if(t <= 0.0) {
                return {x: data[0].x, y: data[0].y};
            }

            for(let i=0; i<data.length-1; i++) {
                if(t >= data[i].t && t <= data[i+1].t) {
                    const progress = (t - data[i].t) / (data[i+1].t - data[i].t);
                    const x = data[i].x + (data[i+1].x - data[i].x) * progress;
                    const y = data[i].y + (data[i+1].y - data[i].y) * progress;
                    return {x, y};
                }
            }
            return {x: data[data.length-1].x, y: data[data.length-1].y};
        }

        function updateLeaderboard(currentRaceTime) {
            let rankings = [];

            lineup.forEach(b => {
                const pos = getInterpolatedPosition(b.id, currentRaceTime);
                if(pos) {
                    const data = telemetry[b.id];
                    let dist = 0;
                    if (data) {
                        for(let i=0; i<data.length-1; i++) {
                            if(data[i].t <= currentRaceTime) {
                                let x1 = data[i].x; let y1 = data[i].y;
                                let x2 = (data[i+1].t <= currentRaceTime) ? data[i+1].x : pos.x;
                                let y2 = (data[i+1].t <= currentRaceTime) ? data[i+1].y : pos.y;
                                dist += Math.hypot(x2-x1, y2-y1);
                            } else {
                                break;
                            }
                        }
                    }
                    rankings.push({bison: b, dist: dist});
                }
            });

            rankings.sort((a, b) => b.dist - a.dist);

            leaderboardItems.innerHTML = '';
            rankings.forEach((r, idx) => {
                const item = document.createElement('div');
                item.className = 'leaderboard-item';
                item.style.borderColor = r.bison.color;
                item.innerHTML = `
                    <span>${idx + 1}. ${r.bison.name}</span>
                    <span style="font-size: 1rem; opacity: 0.7;">Slot ${r.bison.slot}</span>
                `;
                leaderboardItems.appendChild(item);
            });
        }

        function renderFrame() {
            drawTrack();

            if (state === "Betting_Open") {
                leaderboard.style.display = 'none';
                winnerScreen.style.display = 'none';
                overlay.innerText = "WAITING FOR NEXT RACE...\n\nPLACE YOUR BETS!";
                lineup.forEach(b => {
                    const lanePath = getLanePath(b.slot);
                    drawBison(lanePath[0].x, lanePath[0].y, b.color, b.id, b.slot);
                });
            }
            else if (state === "Soft_Closure") {
                leaderboard.style.display = 'none';
                winnerScreen.style.display = 'none';
                const remaining = Math.max(0, 10 - elapsed);
                overlay.innerText = `BETS CLOSING IN: ${Math.ceil(remaining)}s`;
                lineup.forEach(b => {
                    const lanePath = getLanePath(b.slot);
                    drawBison(lanePath[0].x, lanePath[0].y, b.color, b.id, b.slot);
                });
            }
            else if (state === "Closed_Intros") {
                leaderboard.style.display = 'none';
                winnerScreen.style.display = 'none';
                overlay.innerText = "RACE STARTING SOON!";
                lineup.forEach(b => {
                    const lanePath = getLanePath(b.slot);
                    drawBison(lanePath[0].x, lanePath[0].y, b.color, b.id, b.slot);
                });
            }
            else if (state === "Race_Sprint") {
                overlay.innerText = "";
                leaderboard.style.display = 'block';
                winnerScreen.style.display = 'none';

                const currentRaceTime = Math.min(elapsed, raceDuration);
                updateLeaderboard(currentRaceTime);

                lineup.forEach(b => {
                    const pos = getInterpolatedPosition(b.id, currentRaceTime);
                    if(pos) {
                        drawBison(pos.x, pos.y, b.color, b.id, b.slot);
                    }
                });
            }
            else if (state === "Results_Payout") {
                overlay.innerText = "";
                leaderboard.style.display = 'none';

                lineup.forEach(b => {
                    const pos = getInterpolatedPosition(b.id, raceDuration);
                    if(pos) {
                        drawBison(pos.x, pos.y, b.color, b.id, b.slot);
                    }
                });

                if (winnerScreen.style.display !== 'flex') {
                    let winner = lineup[0];
                    let maxDist = -Infinity;

                    lineup.forEach(b => {
                         const data = telemetry[b.id];
                         let dist = 0;
                         if (data) {
                             for(let i=0; i<data.length-1; i++) {
                                 dist += Math.hypot(data[i+1].x - data[i].x, data[i+1].y - data[i].y);
                             }
                         }
                         if(dist > maxDist) {
                             maxDist = dist;
                             winner = b;
                         }
                    });

                    if(winner) {
                        winnerNameDisplay.innerText = winner.name;
                        winnerImageContainer.style.borderColor = winner.color;
                        winnerSlot.innerText = winner.slot;
                        winnerSlot.style.color = winner.color;

                        const img = spriteImages[winner.id];
                        if (img && img.complete && img.naturalHeight !== 0) {
                            winnerSprite.src = img.src;
                            winnerSprite.style.display = 'block';
                            winnerFallbackText.style.display = 'none';
                        } else {
                            winnerSprite.style.display = 'none';
                            winnerFallbackText.style.display = 'block';
                        }
                    }
                    winnerScreen.style.display = 'flex';
                }
            }
        }

        async function pollState() {
            try {
                const res = await fetch('/api/current_race');
                const data = await res.json();
                if(data.status === 'success') {
                    state = data.state;
                    elapsed = data.elapsed_time;
                    lineup = data.lineup;
                    if (data.race_duration) {
                        raceDuration = data.race_duration;
                    }
                    if(Object.keys(data.telemetry).length > 0) {
                        telemetry = data.telemetry;
                    }
                }
            } catch(e) {
                console.error("Polling error", e);
            }
        }

        function loop() {
            if (state === "Race_Sprint") {
                elapsed += (1/60);
            }
            renderFrame();
            requestAnimationFrame(loop);
        }

        setInterval(pollState, 1000);
        pollState();
        requestAnimationFrame(loop);

        function resize() {
            const windowRatio = window.innerWidth / window.innerHeight;
            const canvasRatio = 1920 / 1080;
            if(windowRatio < canvasRatio) {
                canvas.style.width = window.innerWidth + 'px';
                canvas.style.height = (window.innerWidth / canvasRatio) + 'px';
            } else {
                canvas.style.height = window.innerHeight + 'px';
                canvas.style.width = (window.innerHeight * canvasRatio) + 'px';
            }
        }
        window.addEventListener('resize', resize);
        resize();
    </script>
</body>
</html>
