<div class="bison-dash-admin">
    <style>
        .bison-dash-admin {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            background: #161b22;
            color: #f0f6fc;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }

        .bison-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 14px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .bison-title-block {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .big-red-btn {
            background: #ff4444;
            color: white;
            font-size: 1rem;
            font-weight: 800;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 68, 68, 0.35);
            transition: all 0.15s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-height: 48px;
        }
        .big-red-btn:active { transform: scale(0.97); }
        .big-red-btn:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; box-shadow: none; opacity: 0.6; }

        .status-display {
            font-size: 1.15rem;
            font-weight: 800;
            color: #00ffcc;
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid rgba(0, 255, 204, 0.3);
            padding: 4px 12px;
            border-radius: 6px;
            display: inline-block;
            font-family: monospace;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        @media (min-width: 820px) {
            .grid-2col {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background: #0d1117;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }

        .slider-group { margin-bottom: 16px; }
        .slider-group label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        input[type=range] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            accent-color: #00ffcc;
        }

        .lineup-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 12px;
        }
        @media (min-width: 480px) {
            .lineup-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        .bison-card {
            background: #161b22;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            border-left: 5px solid #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 8px;
        }
        .bison-card h4 { margin: 0; font-size: 0.95rem; font-weight: 700; color: #fff; }
        .bison-stats { font-size: 0.78rem; color: #8b949e; font-family: monospace; line-height: 1.4; }
        .force-retire-btn {
            background: #21262d;
            border: 1px solid #ff5555;
            color: #ff5555;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 700;
            min-height: 38px;
            transition: all 0.15s;
        }
        .force-retire-btn:active { background: #ff5555; color: #fff; }

        .server-config {
            background: #0d1117;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #30363d;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .server-config input {
            padding: 8px 12px;
            border: 1px solid #30363d;
            background: #161b22;
            color: white;
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: monospace;
        }
    </style>

    <div class="server-config">
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
            <label for="bd-server-url" style="font-size: 0.85rem; color: #8b949e; font-weight: 600;">Dash Server URL:</label>
            <input type="text" id="bd-server-url" value="http://127.0.0.1:8001" style="max-width: 220px;">
        </div>
        <div style="font-size: 0.8rem; color: #8b949e; font-family: monospace;">
            Port 8001 Live Engine
        </div>
    </div>

    <div class="bison-header">
        <div class="bison-title-block">
            <h3 style="margin:0; font-size: 1.15rem; color: #00ffcc; letter-spacing: 0.5px;"><img src="/static/img/bison_logo.png" style="width: 22px; height: 22px; vertical-align: middle; margin-right: 6px; filter: drop-shadow(0 0 5px rgba(0,255,204,0.5));" alt="Bison" /> BISON DASH ARENA</h3>
            <div id="bd-current-state" class="status-display">Connecting...</div>
        </div>
        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap; width: 100%; max-width: 440px;">
            <button id="bd-panic-btn" class="big-red-btn" style="flex: 1; background: #21262d; border: 1px solid #ff4444; color: #ff6b6b; font-size: 0.85rem;" onclick="triggerPanicReset()">⚠️ PANIC RESET</button>
            <button id="bd-trigger-btn" class="big-red-btn" style="flex: 2; background: #ff3333; font-size: 0.95rem;" onclick="triggerSoftClosure()">TRIGGER CLOSURE</button>
        </div>
    </div>

    <div class="grid-2col">
        <!-- Elastic Clock Sliders -->
        <div class="card">
            <h4 style="margin: 0 0 4px 0; color: #ffd700; font-size: 1rem;">⏱️ Elastic Clock (Phase Durations)</h4>
            <p style="font-size: 0.78rem; color: #8b949e; margin-bottom: 14px;">Adjustments take effect immediately on next cycle.</p>

            <div class="slider-group">
                <label><span>Soft Closure:</span> <span id="val-Soft_Closure" style="color:#00ffcc; font-family:monospace; font-weight:bold;">10s</span></label>
                <input type="range" id="slider-Soft_Closure" min="5" max="30" value="10" oninput="updateTimerVal('Soft_Closure')" onchange="saveTimers()">
            </div>

            <div class="slider-group">
                <label><span>Closed Intros:</span> <span id="val-Closed_Intros" style="color:#00ffcc; font-family:monospace; font-weight:bold;">60s</span></label>
                <input type="range" id="slider-Closed_Intros" min="10" max="180" value="60" oninput="updateTimerVal('Closed_Intros')" onchange="saveTimers()">
            </div>

            <div class="slider-group">
                <label><span>Race Sprint (Fixed):</span> <span style="color:#8b949e; font-family:monospace;">30s</span></label>
                <input type="range" disabled min="30" max="30" value="30" style="opacity:0.5;">
            </div>

            <div class="slider-group">
                <label><span>Results Payout:</span> <span id="val-Results_Payout" style="color:#00ffcc; font-family:monospace; font-weight:bold;">120s</span></label>
                <input type="range" id="slider-Results_Payout" min="30" max="300" value="120" oninput="updateTimerVal('Results_Payout')" onchange="saveTimers()">
            </div>
        </div>

        <!-- Lineup Override -->
        <div class="card">
            <h4 style="margin: 0 0 4px 0; color: #ffd700; font-size: 1rem;">🏇 Active Lineup Override</h4>
            <p style="font-size: 0.78rem; color: #8b949e; margin-bottom: 8px;">Force retire an entry to instantly spawn a rookie.</p>
            <div id="bd-lineup-grid" class="lineup-grid">
                <div style="color: #8b949e; font-size: 0.85rem; padding: 10px;">Loading lineup...</div>
            </div>
        </div>
    </div>

    <script>
        let currentState = "Unknown";

        function getBaseUrl() {
            let url = document.getElementById('bd-server-url').value.trim();
            if (url.endsWith('/')) {
                url = url.slice(0, -1);
            }
            return url;
        }

        async function fetchBisonDashState() {
            try {
                const res = await fetch(getBaseUrl() + '/api/bisondash/state');
                const data = await res.json();
                if (data.status === 'success' && data.state_data) {
                    currentState = data.state_data.state;
                    document.getElementById('bd-current-state').innerText = currentState;

                    const btn = document.getElementById('bd-trigger-btn');
                    if (currentState === "Betting_Open") {
                        btn.disabled = false;
                        btn.style.opacity = "1";
                    } else {
                        btn.disabled = true;
                        btn.style.opacity = "0.5";
                    }

                    // Update sliders with backend state if they exist
                    if(data.state_data.timers) {
                        for(const k of ['Soft_Closure', 'Closed_Intros', 'Results_Payout']) {
                            const val = data.state_data.timers[k];
                            const s = document.getElementById('slider-' + k);
                            const v = document.getElementById('val-' + k);
                            if(s && document.activeElement !== s) {
                                s.value = val;
                                v.innerText = val + "s";
                            }
                        }
                    }
                }
            } catch(e) {
                console.error("Error fetching state", e);
                document.getElementById('bd-current-state').innerText = "Disconnected";
            }
        }

        async function fetchBisonDashLineup() {
            try {
                const res = await fetch(getBaseUrl() + '/api/bisondash/lineup');
                const data = await res.json();
                if (data.status === 'success') {
                    const grid = document.getElementById('bd-lineup-grid');
                    grid.innerHTML = '';
                    data.lineup.forEach(b => {
                        grid.innerHTML += `
                            <div class="bison-card" style="border-left-color: ${b.color}">
                                <h4>Slot ${b.slot}: ${b.name}</h4>
                                <div class="bison-stats">
                                    Spd:${b.stats.bison_speed} | Stm:${b.stats.bison_stamina}<br>
                                    Jck:${b.stats.jockey_reaction} | Crn:${b.stats.bison_cornering}
                                </div>
                                <button class="force-retire-btn" onclick="forceRetire('${b.id}')">Force Retire</button>
                            </div>
                        `;
                    });
                }
            } catch(e) { console.error("Error fetching lineup", e); }
        }

        async function triggerSoftClosure() {
            if(confirm("Trigger Soft Closure phase now?")) {
                await fetch(getBaseUrl() + '/api/bisondash/state/update', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({state: 'Soft_Closure'})
                });
                fetchBisonDashState();
            }
        }

        async function triggerPanicReset() {
            if(confirm("DANGER: Immediately reset game to Betting_Open?")) {
                await fetch(getBaseUrl() + '/api/local/reset', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        action: "GLOBAL_RESET",
                        timestamp: Math.floor(Date.now() / 1000),
                        target_state: "IDLE"
                    })
                });
                fetchBisonDashState();
            }
        }

        async function forceRetire(bisonId) {
            if(confirm("Retire this bison and generate a replacement?")) {
                await fetch(getBaseUrl() + '/api/bisondash/lineup/retire', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({bison_id: bisonId})
                });
                fetchBisonDashLineup();
            }
        }

        function updateTimerVal(timer) {
            const val = document.getElementById('slider-' + timer).value;
            document.getElementById('val-' + timer).innerText = val + "s";
        }

        async function saveTimers() {
            const payload = {
                soft_closure: parseInt(document.getElementById('slider-Soft_Closure').value),
                closed_intros: parseInt(document.getElementById('slider-Closed_Intros').value),
                race_sprint: 30, // Fixed
                results_payout: parseInt(document.getElementById('slider-Results_Payout').value)
            };

            await fetch(getBaseUrl() + '/api/bisondash/timers/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
        }

        // Pollers
        setInterval(fetchBisonDashState, 1000);
        setInterval(fetchBisonDashLineup, 5000); // Less frequent for lineup
        fetchBisonDashState();
        fetchBisonDashLineup();
    </script>
</div>
