<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Admin Console</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --accent: #00ffcc;
            --danger: #ff4444;
            --success: #00C851;
            --border: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-font-smoothing: antialiased;
            padding: 10px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .panic-btn {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .panic-btn:active {
            opacity: 0.8;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .game-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .game-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-running {
            background-color: rgba(0, 200, 81, 0.2);
            color: var(--success);
        }

        .status-stopped {
            background-color: rgba(170, 170, 170, 0.2);
            color: var(--text-secondary);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button.action-btn {
            flex: 1;
            background-color: #2c2c2c;
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 12px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        button.action-btn.start { border-bottom: 3px solid var(--success); }
        button.action-btn.stop { border-bottom: 3px solid var(--danger); }

        button.action-btn:active {
            background-color: #3c3c3c;
        }

        .logs-panel {
            margin-top: 20px;
            background-color: #000;
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--accent);
        }

        .log-line {
            margin-bottom: 4px;
            word-wrap: break-word;
        }

        .data-test {
            margin-top: 20px;
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .data-test input {
            padding: 8px;
            background: #000;
            border: 1px solid var(--border);
            color: white;
            border-radius: 4px;
        }

    </style>
</head>
<body>

    <header>
        <h1>Venue Command</h1>
        <button class="panic-btn" onclick="globalReset()">Global Reset</button>
    </header>

    <div class="grid" id="games-grid">
        <!-- Rendered by JS -->
    </div>

    <div class="data-test">
        <h3>Test Data Redundancy</h3>
        <p style="font-size:0.8rem; color:var(--text-secondary); margin-bottom:10px;">Injecting tokens triggers an atomic write to players.json + timestamped archive backup.</p>
        <input type="text" id="player-id" placeholder="Player ID (e.g. user1)">
        <input type="number" id="token-amount" placeholder="Amount (e.g. 50)">
        <button class="action-btn" style="padding: 8px 15px; margin-left: 10px;" onclick="injectTokens()">Inject</button>
    </div>

    <h3 style="margin-top:20px; margin-bottom:10px; color:var(--text-secondary);">Health Monitor (Aggregated Logs)</h3>
    <div class="logs-panel" id="logs-container">
        <!-- Logs go here -->
    </div>

    <script>
        async function fetchStatus() {
            try {
                const res = await fetch('/api/process/status');
                const data = await res.json();
                renderGrid(data);
            } catch (e) {
                console.error("Failed to fetch status");
            }
        }

        function renderGrid(statusData) {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = '';

            for (const [gameId, info] of Object.entries(statusData)) {
                const isRunning = info.running;
                const statusClass = isRunning ? 'status-running' : 'status-stopped';
                const statusText = isRunning ? `ON (Port ${info.port})` : 'OFF';

                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-header">
                        <div class="game-title">${gameId.replace('_', ' ').toUpperCase()}</div>
                        <div class="status-badge ${statusClass}">${statusText}</div>
                    </div>
                    <div class="controls">
                        <button class="action-btn start" onclick="startProcess('${gameId}')">START</button>
                        <button class="action-btn stop" onclick="stopProcess('${gameId}')">STOP</button>
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        async function startProcess(gameId) {
            await fetch('/api/process/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({game_id: gameId})
            });
            fetchStatus();
        }

        async function stopProcess(gameId) {
            await fetch('/api/process/stop', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({game_id: gameId})
            });
            fetchStatus();
        }

        async function globalReset() {
            if(confirm("DANGER: This will broadcast a reset to all active game ports. Are you sure?")) {
                await fetch('/api/global/reset', { method: 'POST' });
                alert("Global reset payload broadcasted.");
            }
        }

        async function fetchLogs() {
            try {
                const res = await fetch('/api/global/logs');
                const data = await res.json();
                const container = document.getElementById('logs-container');
                container.innerHTML = data.logs.map(l => `<div class="log-line">${l}</div>`).join('');
                container.scrollTop = container.scrollHeight;
            } catch(e) {}
        }

        async function injectTokens() {
            const pid = document.getElementById('player-id').value;
            const amt = parseInt(document.getElementById('token-amount').value);
            if(!pid || isNaN(amt)) return alert("Invalid inputs");

            const res = await fetch('/api/admin/inject-tokens', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({player_id: pid, amount: amt})
            });
            const data = await res.json();
            alert(`Tokens injected. New balance for ${pid}: ${data.new_balance}`);
        }

        // Loops
        setInterval(fetchStatus, 2000);
        setInterval(fetchLogs, 1000);
        fetchStatus();
        fetchLogs();
    </script>
</body>
</html>
