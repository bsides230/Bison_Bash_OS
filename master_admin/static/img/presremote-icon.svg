<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c121e"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="url(#cyanGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Broadcast Signal Waves -->
  <path d="M 180 90 A 80 40 0 0 1 332 90" fill="none" stroke="#00ffcc" stroke-width="8" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
  <path d="M 140 60 A 130 65 0 0 1 372 60" fill="none" stroke="#ffd700" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

  <!-- Remote Controller Body -->
  <rect x="176" y="115" width="160" height="305" rx="36" fill="#131b28" stroke="#00ffcc" stroke-width="6"/>

  <!-- Remote Screen / Slide Thumbnail Area -->
  <rect x="198" y="145" width="116" height="82" rx="14" fill="#080c14" stroke="#303b4d" stroke-width="3"/>
  <!-- Mini Play / Slide Icon inside screen -->
  <polygon points="244,168 274,186 244,204" fill="url(#cyanGrad)"/>

  <!-- Tactile Control Buttons -->
  <!-- Left / Prev Button -->
  <circle cx="224" cy="272" r="22" fill="#1f293d" stroke="#3b4861" stroke-width="3"/>
  <polygon points="228,264 218,272 228,280" fill="#f0f6fc"/>

  <!-- Right / Next Button -->
  <circle cx="288" cy="272" r="22" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <polygon points="284,264 294,272 284,280" fill="#061018"/>

  <!-- Big Advance Slider / Key Button -->
  <rect x="204" y="325" width="104" height="58" rx="18" fill="url(#goldGrad)" filter="url(#glow)"/>
  <text x="256" y="362" fill="#061018" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="20" text-anchor="middle" letter-spacing="1">NEXT</text>

  <!-- Status LED -->
  <circle cx="256" cy="132" r="5" fill="#00ffcc" filter="url(#glow)"/>
</svg>
